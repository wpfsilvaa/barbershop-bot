version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bot_whatsapp_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bot_whatsapp
      - TZ=America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bot_whatsapp_backend
    restart: always
    network_mode: "host"
    environment:
      - PORT=5000
      - DB_USER=postgres
      - DB_HOST=127.0.0.1
      - DB_DATABASE=bot_whatsapp
      - DB_PASSWORD=postgres
      - DB_PORT=5432
      - JWT_SECRET=8f4a3e2d1c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3
      - CORS_ORIGIN=http://localhost:5173
      - TZ=America/Sao_Paulo
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/auth_info_baileys
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bot_whatsapp_frontend
    restart: always
    network_mode: "host"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
