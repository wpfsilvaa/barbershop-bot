version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bot_whatsapp_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bot_whatsapp
      - TZ=America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bot_whatsapp_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bot_whatsapp_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_USER=postgres
      - DB_HOST=db
      - DB_DATABASE=bot_whatsapp
      - DB_PASSWORD=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=8f4a3e2d1c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3
      - CORS_ORIGIN=http://localhost:5173
      - TZ=America/Sao_Paulo
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules

  whatsapp-gateway:
    build:
      context: ./whatsapp-bot
      dockerfile: Dockerfile
    container_name: bot_whatsapp_gateway
    restart: always
    environment:
      - DB_USER=postgres
      - DB_HOST=db
      - DB_DATABASE=bot_whatsapp
      - DB_PASSWORD=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TZ=America/Sao_Paulo
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bot_whatsapp_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
