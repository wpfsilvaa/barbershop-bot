version: '3.8'

# Segredos vêm de um arquivo `.env` na raiz do projeto (veja `.env.example`).
# A sintaxe `${VAR:?mensagem}` faz o `docker compose up` falhar se a variável não
# estiver definida — antes o JWT_SECRET estava escrito em texto puro neste arquivo,
# que é versionado, então qualquer pessoa com acesso ao repositório podia assinar
# tokens de administrador de qualquer barbearia.

services:
  db:
    image: postgres:15-alpine
    container_name: bot_whatsapp_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?defina DB_PASSWORD no .env da raiz}
      - POSTGRES_DB=${DB_DATABASE:-bot_whatsapp}
      - TZ=America/Sao_Paulo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_DATABASE:-bot_whatsapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bot_whatsapp_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bot_whatsapp_backend
    restart: always
    network_mode: "host"
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-development}
      - DB_USER=${DB_USER:-postgres}
      - DB_HOST=127.0.0.1
      - DB_DATABASE=${DB_DATABASE:-bot_whatsapp}
      - DB_PASSWORD=${DB_PASSWORD:?defina DB_PASSWORD no .env da raiz}
      - DB_PORT=5432
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env da raiz (mínimo 32 caracteres)}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?defina INTERNAL_API_KEY no .env da raiz}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Sao_Paulo}
      - TZ=America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  whatsapp-gateway:
    build:
      context: ./whatsapp-bot
      dockerfile: Dockerfile
    container_name: bot_whatsapp_gateway
    restart: always
    network_mode: "host"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DB_USER=${DB_USER:-postgres}
      - DB_HOST=127.0.0.1
      - DB_DATABASE=${DB_DATABASE:-bot_whatsapp}
      - DB_PASSWORD=${DB_PASSWORD:?defina DB_PASSWORD no .env da raiz}
      - DB_PORT=5432
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?defina INTERNAL_API_KEY no .env da raiz}
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Sao_Paulo}
      - TZ=America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bot_whatsapp_frontend
    restart: always
    network_mode: "host"
    environment:
      - API_PROXY_TARGET=http://127.0.0.1:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
